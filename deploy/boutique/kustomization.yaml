apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique

resources:
  - namespace.yaml
  - release/kubernetes-manifests.yaml

labels:
  - pairs:
      aegis.io/managed: "true"

patches:
  - target:
      kind: Deployment
      name: redis-cart
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: redis-cart
        labels:
          aegis.io/protected: "true"
